<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  // Canvas fallback and thumbnail source for the native jellyfish-points
  // dweet (Medusa de Puntos): a 10k-point spiral with a one radian step.
  const canvas = document.getElementById('canvas');
  const context = canvas.getContext('2d', { alpha: false });
  let t = 0;

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.max(1, Math.round(innerWidth * ratio));
    canvas.height = Math.max(1, Math.round(innerHeight * ratio));
  }

  function draw() {
    requestAnimationFrame(draw);
    if (window.__pwPaused) return;
    t += Math.PI / 120;
    const scaleX = canvas.width / 400;
    const scaleY = canvas.height / 400;
    context.fillStyle = window.__pwBackgroundColor || '#000';
    context.fillRect(0, 0, canvas.width, canvas.height);
    // The dweet strokes white at alpha 96/255; overlapping points stack.
    context.fillStyle = window.__pwParticleColor || '#fff';
    context.globalAlpha = 0.38;
    for (let i = 9999; i--;) {
      const y = i / 345;
      // JS `y^8`: bitwise XOR on the int32 truncation of y.
      const base = y < 11 ? 6 + Math.sin((y | 0) ^ 8) * 6 : y / 5 + Math.cos(y / 2);
      const k = base * Math.cos(i - t / 4);
      const e = y / 7 - 13;
      const d = Math.sqrt(k * k + e * e) + Math.sin(e / 4 + t) / 2;
      const c = d / 2 + 1 - t / 2;
      const q = y * k / d * (3 + Math.sin(d * 2 + y / 2 - t * 4));
      const px = (q + 60 * Math.cos(c) + 200) * scaleX;
      const py = (q * Math.sin(c) + d * 29 - 170) * scaleY;
      context.fillRect(px, py, 1, 1);
    }
    context.globalAlpha = 1;
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
</script>
</body>
</html>
