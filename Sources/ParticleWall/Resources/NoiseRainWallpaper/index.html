<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  // Canvas fallback and thumbnail source. The live wallpaper keeps particle
  // state and trail history in Metal buffers.
  const canvas = document.getElementById('canvas');
  const context = canvas.getContext('2d', { alpha: false });
  const particles = new Array(720 * 9);
  let frame = 0;
  let tick = 0;

  function fract(value) {
    return value - Math.floor(value);
  }

  function hash(x, y, z) {
    let px = fract(x * 0.1031);
    let py = fract(y * 0.1031);
    let pz = fract(z * 0.1031);
    const mixed = px * (py + 33.33) + py * (pz + 33.33) + pz * (px + 33.33);
    px += mixed;
    py += mixed;
    pz += mixed;
    return fract((px + py) * pz);
  }

  function noise3(x, y, z) {
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    let fx = x - ix, fy = y - iy, fz = z - iz;
    fx = fx * fx * (3 - 2 * fx);
    fy = fy * fy * (3 - 2 * fy);
    fz = fz * fz * (3 - 2 * fz);
    const x00 = hash(ix, iy, iz) * (1 - fx) + hash(ix + 1, iy, iz) * fx;
    const x10 = hash(ix, iy + 1, iz) * (1 - fx) + hash(ix + 1, iy + 1, iz) * fx;
    const x01 = hash(ix, iy, iz + 1) * (1 - fx) + hash(ix + 1, iy, iz + 1) * fx;
    const x11 = hash(ix, iy + 1, iz + 1) * (1 - fx) + hash(ix + 1, iy + 1, iz + 1) * fx;
    return (x00 * (1 - fy) + x10 * fy) * (1 - fz)
      + (x01 * (1 - fy) + x11 * fy) * fz;
  }

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.max(1, Math.round(innerWidth * ratio));
    canvas.height = Math.max(1, Math.round(innerHeight * ratio));
    context.fillStyle = window.__pwBackgroundColor || '#000';
    context.fillRect(0, 0, canvas.width, canvas.height);
  }

  function draw() {
    requestAnimationFrame(draw);
    if (window.__pwPaused) return;

    context.filter = 'none';
    context.fillStyle = window.__pwTrailColor || 'rgba(0,0,0,0.035)';
    context.fillRect(0, 0, canvas.width, canvas.height);

    for (let count = 0; count < 9; count++) {
      const index = tick++ % particles.length;
      particles[index] = { x: (tick * 99) % 720, y: 0, gravity: 0, size: 3 };
    }

    const fit = Math.min(canvas.width, canvas.height) / 720;
    const offsetX = (canvas.width - 720 * fit) / 2;
    const offsetY = (canvas.height - 720 * fit) / 2;
    context.fillStyle = window.__pwParticleColorHex || '#fff';
    context.filter = `blur(${Math.max(0.35, fit * 0.45)}px)`;

    for (const particle of particles) {
      if (!particle) continue;
      particle.size *= 0.997;
      const value = noise3(particle.x / 720, particle.y / 9, tick / 720);
      if (value > 0.4) {
        particle.gravity += 0.5;
        particle.y += particle.gravity;
      } else {
        particle.x += value % 0.1 > 0.05 ? 1 : -1;
        particle.gravity = 0;
        particle.y += 0.5;
      }
      const size = Math.max(0.5, particle.size * fit) * (window.__pwParticleSizeScale || 1);
      context.fillRect(offsetX + particle.x * fit - size / 2,
                       offsetY + particle.y * fit - size / 2, size, size);
    }
    frame++;
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
</script>
<script>
  (function () {
    if (window.__pwAppearanceBridge) return;
    window.__pwAppearanceBridge = true;

    var DEFAULT_BG = 0x000000;
    var DEFAULT_PARTICLE = 0xffffff;
    var PARTICLE_ALPHA = 1;
    var TRAIL_ALPHA = 0.035;

    var controls = [
      { id: 'backgroundColor', label: 'Color del fondo', category: 'Apariencia', min: 0, max: 16777215, step: 1, defaultValue: DEFAULT_BG, kind: 'color' },
      { id: 'particleColor', label: 'Color de partículas', category: 'Apariencia', min: 0, max: 16777215, step: 1, defaultValue: DEFAULT_PARTICLE, kind: 'color' },
      { id: 'particleSize', label: 'Tamaño', category: 'Apariencia', min: 0.25, max: 4, step: 0.05, defaultValue: 1 }
    ];

    function hex(value) {
      value = Math.max(0, Math.min(16777215, Math.round(Number(value) || 0)));
      return '#' + ('00000' + value.toString(16)).slice(-6);
    }
    function rgba(value, alpha) {
      value = Math.max(0, Math.min(16777215, Math.round(Number(value) || 0)));
      return 'rgba(' + ((value >> 16) & 255) + ',' + ((value >> 8) & 255) + ',' + (value & 255) + ',' + alpha + ')';
    }

    window.__pwBackgroundColor = hex(DEFAULT_BG);
    window.__pwTrailColor = rgba(DEFAULT_BG, TRAIL_ALPHA);
    window.__pwParticleColor = rgba(DEFAULT_PARTICLE, PARTICLE_ALPHA);
    window.__pwParticleColorHex = hex(DEFAULT_PARTICLE);
    window.__pwParticleSizeScale = 1;

    window.__pwGetControls = function () { return controls; };
    window.__pwApplySettings = function (settings) {
      if (!settings || typeof settings !== 'object') return;
      if (settings.backgroundColor !== undefined) {
        window.__pwBackgroundColor = hex(settings.backgroundColor);
        window.__pwTrailColor = rgba(settings.backgroundColor, TRAIL_ALPHA);
      }
      if (settings.particleColor !== undefined) {
        window.__pwParticleColor = rgba(settings.particleColor, PARTICLE_ALPHA);
        window.__pwParticleColorHex = hex(settings.particleColor);
      }
      if (settings.particleSize !== undefined) window.__pwParticleSizeScale = Math.max(0.1, Number(settings.particleSize) || 1);
    };
  })();
</script>
</body>
</html>
