<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  * { user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<script src="assets/three.min.js"></script>
<script>
  // ParticleWall boilerplate: full-screen scene/camera/renderer, resize handling
  // and a default particle system. The imported snippet runs after this setup
  // and can use (or replace) any of these globals:
  //   scene, camera, renderer, geometry, material, particles,
  //   positions (Float32Array), COUNT
  // Optionally define `function pwUpdate(t) { ... }` for per-frame logic.

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
  camera.position.z = 6;

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 1);
  document.body.appendChild(renderer.domElement);

  var COUNT = 5000;
  var positions = new Float32Array(COUNT * 3);
  for (var i = 0; i < COUNT * 3; i++) {
    positions[i] = (Math.random() - 0.5) * 8;
  }

  var geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  var material = new THREE.PointsMaterial({
    color: 0x00ff88,
    size: 0.03,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  var particles = new THREE.Points(geometry, material);
  scene.add(particles);

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // === USER SNIPPET (formation / animation logic) ===
  /*__PW_SNIPPET__*/
  // === END USER SNIPPET ===

  function pwLoop(t) {
    requestAnimationFrame(pwLoop);
    if (window.__pwPaused) return;
    if (typeof pwUpdate === 'function') {
      pwUpdate(t);
    } else {
      particles.rotation.y = t * 0.00008;
    }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(pwLoop);

  // === ParticleWall appearance/transform bridge ===
  (function () {
    if (window.__pwAppearanceBridge) return;
    window.__pwAppearanceBridge = true;

    var baseSize = (material && typeof material.size === 'number') ? material.size : 1;
    var baseOpacity = (material && typeof material.opacity === 'number') ? material.opacity : 1;
    var clearHex = 0x000000;
    try { clearHex = renderer.getClearColor().getHex(); } catch (e) {}
    var particleHex = 0x00ff88;
    try { particleHex = material && material.color ? material.color.getHex() : 0x00ff88; } catch (e) {}

    var controls = [
      { id: 'backgroundColor', label: 'Color del fondo', category: 'Apariencia', min: 0, max: 16777215, step: 1, defaultValue: clearHex, kind: 'color' },
      { id: 'particleColor', label: 'Color de partículas', category: 'Apariencia', min: 0, max: 16777215, step: 1, defaultValue: particleHex, kind: 'color' },
      { id: 'particleSize', label: 'Tamaño', category: 'Apariencia', min: 0.1, max: 10, step: 0.05, defaultValue: 1 },
      { id: 'brightness', label: 'Intensidad de puntos', category: 'Apariencia', min: 0.25, max: 10, step: 0.05, defaultValue: 1 },
      { id: 'positionX', label: 'Posición X', category: 'Transformación', min: -100, max: 100, step: 0.5, defaultValue: 0 },
      { id: 'positionY', label: 'Posición Y', category: 'Transformación', min: -100, max: 100, step: 0.5, defaultValue: 0 },
      { id: 'positionZ', label: 'Posición Z', category: 'Transformación', min: -100, max: 100, step: 0.5, defaultValue: 0 },
      { id: 'rotationX', label: 'Rotación X', category: 'Transformación', min: -180, max: 180, step: 1, defaultValue: 0 },
      { id: 'rotationY', label: 'Rotación Y', category: 'Transformación', min: -180, max: 180, step: 1, defaultValue: 0 },
      { id: 'rotationZ', label: 'Rotación Z', category: 'Transformación', min: -180, max: 180, step: 1, defaultValue: 0 },
      { id: 'scale', label: 'Escala', category: 'Transformación', min: 0.1, max: 4, step: 0.05, defaultValue: 1 }
    ];

    function num(settings, key) {
      var value = Number(settings[key]);
      return isFinite(value) ? value : null;
    }

    window.__pwGetControls = function () { return controls; };
    window.__pwApplySettings = function (settings) {
      if (!settings || typeof settings !== 'object') return;
      var value = num(settings, 'backgroundColor');
      if (value !== null && renderer) renderer.setClearColor(new THREE.Color(value), 1);
      value = num(settings, 'particleColor');
      if (value !== null && material) material.color = new THREE.Color(value);
      value = num(settings, 'particleSize');
      if (value !== null && material && typeof material.size === 'number') {
        material.size = Math.max(0.01, baseSize * value);
      }
      value = num(settings, 'brightness');
      if (value !== null && material && typeof material.opacity === 'number') {
        material.opacity = Math.max(0, Math.min(1, baseOpacity * value));
      }
      value = num(settings, 'positionX');
      if (value !== null && particles && particles.position) particles.position.x = value;
      value = num(settings, 'positionY');
      if (value !== null && particles && particles.position) particles.position.y = value;
      value = num(settings, 'positionZ');
      if (value !== null && particles && particles.position) particles.position.z = value;
      value = num(settings, 'rotationX');
      if (value !== null && particles && particles.rotation) particles.rotation.x = value * Math.PI / 180;
      value = num(settings, 'rotationY');
      if (value !== null && particles && particles.rotation) particles.rotation.y = value * Math.PI / 180;
      value = num(settings, 'rotationZ');
      if (value !== null && particles && particles.rotation) particles.rotation.z = value * Math.PI / 180;
      value = num(settings, 'scale');
      if (value !== null && particles && particles.scale) particles.scale.setScalar(Math.max(0.01, value));
    };
  })();
</script>
</body>
</html>
