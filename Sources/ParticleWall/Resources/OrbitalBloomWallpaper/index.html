<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030609; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  // Canvas fallback and thumbnail source. The live wallpaper uses Metal.
  const canvas = document.getElementById('canvas');
  const context = canvas.getContext('2d', { alpha: false });
  let time = 0;

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.max(1, Math.round(innerWidth * ratio));
    canvas.height = Math.max(1, Math.round(innerHeight * ratio));
  }

  function draw() {
    requestAnimationFrame(draw);
    if (window.__pwPaused) return;
    time += Math.PI / 60;
    context.fillStyle = '#030609';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = 'rgba(232,255,255,0.57)';
    const fit = Math.min(canvas.width, canvas.height) / 400;
    const offsetX = (canvas.width - 400 * fit) / 2;
    const offsetY = (canvas.height - 400 * fit) / 2;
    const size = Math.max(1.25, fit * 1.1);

    for (let i = 29999; i >= 0; i--) {
      const y = i / 799;
      const k = 5 * Math.cos(i / 48);
      const e = 5 * Math.cos(y / 9);
      const d = Math.pow(Math.hypot(k, e) / (6 + i % 4), 4) + 4;
      const q = k * (3 + e / 2 * Math.sin(d * 8 + k / 9 - time))
        - 3 * Math.sin(k * d / 3) + (1 + i % 2) * 80;
      const c = d - time / 9 + i % 5;
      const x = q * Math.sin(c) + 200;
      const py = q * Math.cos(c - i % 2 + (i % 5) * 3 + 7) + 200;
      context.fillRect(offsetX + x * fit, offsetY + py * fit, size, size);
    }
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
</script>
</body>
</html>
