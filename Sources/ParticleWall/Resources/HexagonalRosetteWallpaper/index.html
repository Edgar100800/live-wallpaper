<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030609; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  // Canvas fallback and thumbnail source. Metal generates the six rotations
  // directly instead of copying the previous framebuffer like the p5 original.
  const canvas = document.getElementById('canvas');
  const context = canvas.getContext('2d', { alpha: false });
  const rotations = Array.from({ length: 6 }, (_, copy) => {
    const angle = copy * Math.PI / 3;
    return [Math.cos(angle), Math.sin(angle)];
  });
  let time = 0;

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.max(1, Math.round(innerWidth * ratio));
    canvas.height = Math.max(1, Math.round(innerHeight * ratio));
  }

  function draw() {
    requestAnimationFrame(draw);
    if (window.__pwPaused) return;
    time += Math.PI / 240;
    context.fillStyle = '#030609';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = 'rgba(232,255,255,0.42)';
    const fit = Math.min(canvas.width, canvas.height) / 400;
    const offsetX = (canvas.width - 400 * fit) / 2;
    const offsetY = (canvas.height - 400 * fit) / 2;
    const size = Math.max(1.1, fit);

    for (let i = 19999; i > 6; i--) {
      const k = i % 25 - 12;
      const e = i / 800;
      const d = 7 * Math.cos(Math.hypot(k, e) / 3 + time / 2);
      const x = k * 4 + d * k * Math.sin(d + e / 9 + time);
      const y = e * 2 - d * 9 - d * 9 * Math.cos(d + time);
      for (const [cosine, sine] of rotations) {
        const rx = x * cosine - y * sine;
        const ry = x * sine + y * cosine;
        context.fillRect(offsetX + (rx + 200) * fit,
                         offsetY + (ry + 200) * fit, size, size);
      }
    }
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
</script>
</body>
</html>
