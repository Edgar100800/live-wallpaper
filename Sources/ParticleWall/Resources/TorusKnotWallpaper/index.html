<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  // Canvas fallback and thumbnail source for the native tesseract model:
  // 350 stippled wireframe blocks riding a (2,5) torus knot in 4 staggered
  // tracks plus a 5% stardust shell (the user's THREE.js ParticlesSwarm
  // ported point by point). Presentation follows ParticleWall's other
  // models: monochrome fixed-size points on the p5 WEBGL camera, with alpha
  // separating wires, stippled faces, corners, pulses and stardust.
  const canvas = document.getElementById('canvas');
  const context = canvas.getContext('2d', { alpha: false });
  const layerCanvas = document.createElement('canvas');
  layerCanvas.width = 400;
  layerCanvas.height = 400;
  const layerContext = layerCanvas.getContext('2d');
  const TWO_PI = Math.PI * 2;
  const R = 50, r = 15, P = 2, Q = 5;
  const BLOCKS = 350, BLOCK_LEN = 7, BLOCK_SIZE = 2.5, STAGGER = 4;
  const TWIST = 1.5, FLOW = 0.3;
  const STARDUST = 1000, REMAINING = 19000;
  const PPB = REMAINING / BLOCKS;
  const NUM_WIRE = PPB * 0.85;
  const fract = v => v - Math.floor(v);
  const startedAt = performance.now();

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.max(1, Math.round(innerWidth * ratio));
    canvas.height = Math.max(1, Math.round(innerHeight * ratio));
  }

  function draw() {
    requestAnimationFrame(draw);
    if (window.__pwPaused) return;
    const time = (performance.now() - startedAt) / 1000;

    // Global spin: rotateX(time*0.11) then rotateY(time*0.17).
    const cgx = Math.cos(time * 0.11), sgx = Math.sin(time * 0.11);
    const cgy = Math.cos(time * 0.17), sgy = Math.sin(time * 0.17);

    layerContext.clearRect(0, 0, 400, 400);
    for (let i = 0; i < 20000; i++) {
      let wx, wy, wz, alpha;
      if (i < STARDUST) {
        const sd1 = fract(Math.sin(i * 11.11) * 43758.54);
        const sd2 = fract(Math.cos(i * 22.22) * 43758.54);
        const sd3 = fract(Math.sin(i * 33.33) * 43758.54);
        const radiusDist = R * 1.2 + sd1 * 80;
        const theta = sd2 * TWO_PI;
        const phi = Math.acos(sd3 * 2 - 1);
        wx = radiusDist * Math.sin(phi) * Math.cos(theta)
          + Math.sin(time * 0.2 + i * 0.1) * 10;
        wy = radiusDist * Math.sin(phi) * Math.sin(theta)
          + Math.cos(time * 0.25 + i * 0.1) * 10;
        wz = radiusDist * Math.cos(phi) + Math.sin(time * 0.15 + i * 0.2) * 10;
        const twinkle = Math.pow((Math.sin(time * 3 + i) + 1) * 0.5, 8);
        alpha = 0.15 + twinkle * 0.85;
      } else {
        const iRem = i - STARDUST;
        const blockId = Math.floor(iRem / PPB);
        const localId = iRem - blockId * PPB;
        const isWire = localId < NUM_WIRE;
        const tBase = blockId / BLOCKS * TWO_PI;
        const t = tBase + time * FLOW * 0.1;

        const cosQt = Math.cos(Q * t), sinQt = Math.sin(Q * t);
        const cosPt = Math.cos(P * t), sinPt = Math.sin(P * t);
        const ringRadius = R + r * cosQt;
        const cx0 = ringRadius * cosPt, cy0 = ringRadius * sinPt;
        const cz0 = r * sinQt;

        // Analytic tangent, binormal and normal of the knot path.
        let tx = -P * ringRadius * sinPt - Q * r * sinQt * cosPt;
        let ty = P * ringRadius * cosPt - Q * r * sinQt * sinPt;
        let tz = Q * r * cosQt;
        const tLen = Math.sqrt(tx * tx + ty * ty + tz * tz) + 0.0001;
        tx /= tLen; ty /= tLen; tz /= tLen;
        let bx = -tz * sinPt, by = tz * cosPt, bz = tx * sinPt - ty * cosPt;
        const bLen = Math.sqrt(bx * bx + by * by + bz * bz) + 0.0001;
        bx /= bLen; by /= bLen; bz /= bLen;
        let nx = by * tz - bz * ty;
        let ny = bz * tx - bx * tz;
        let nz = bx * ty - by * tx;

        const twistAngle = tBase * TWIST + time * FLOW * 0.5;
        const cosTw = Math.cos(twistAngle), sinTw = Math.sin(twistAngle);
        const fnx = nx * cosTw - bx * sinTw;
        const fny = ny * cosTw - by * sinTw;
        const fnz = nz * cosTw - bz * sinTw;
        const fbx = nx * sinTw + bx * cosTw;
        const fby = ny * sinTw + by * cosTw;
        const fbz = nz * sinTw + bz * cosTw;

        const track = blockId % 4;
        const c1 = track % 2 === 0 ? 1 : -1;
        const c2 = track < 2 ? 1 : -1;
        const cx = cx0 + fnx * c1 * STAGGER + fbx * c2 * STAGGER;
        const cy = cy0 + fny * c1 * STAGGER + fby * c2 * STAGGER;
        const cz = cz0 + fnz * c1 * STAGGER + fbz * c2 * STAGGER;

        let lx = 0, ly = 0, lz = 0, u = 0;
        if (isWire) {
          const edgePosRaw = localId / NUM_WIRE * 12;
          const edgeId = Math.min(11, Math.floor(edgePosRaw));
          u = (edgePosRaw - edgeId) * 2 - 1;
          const axis = edgeId % 3;
          const corner = Math.floor(edgeId / 3);
          const e1 = corner % 2 === 0 ? -1 : 1;
          const e2 = corner < 2 ? -1 : 1;
          if (axis === 0) { lx = u; ly = e1; lz = e2; }
          else if (axis === 1) { lx = e1; ly = u; lz = e2; }
          else { lx = e1; ly = e2; lz = u; }
        } else {
          const s1 = fract(Math.sin(localId * 12.989 + blockId * 78.233) * 43758.545);
          const s2 = fract(Math.cos(localId * 39.346 + blockId * 53.211) * 43758.545);
          const s3 = fract(Math.sin(localId * 73.156 + blockId * 12.742) * 43758.545);
          const s4 = fract(Math.cos(localId * 23.456 + blockId * 89.123) * 43758.545);
          const faceAxis = Math.min(2, Math.floor(s1 * 3));
          const signFace = s2 > 0.5 ? 1 : -1;
          const u2 = s3 * 2 - 1, v2 = s4 * 2 - 1;
          if (faceAxis === 0) { lx = signFace; ly = u2; lz = v2; }
          else if (faceAxis === 1) { lx = u2; ly = signFace; lz = v2; }
          else { lx = u2; ly = v2; lz = signFace; }
        }
        lx *= BLOCK_LEN; ly *= BLOCK_SIZE; lz *= BLOCK_SIZE;

        wx = cx + lx * tx + ly * fnx + lz * fbx;
        wy = cy + lx * ty + ly * fny + lz * fby;
        wz = cz + lx * tz + ly * fnz + lz * fbz;

        alpha = isWire ? 1 : 0.4;
        if (isWire) {
          const pulseEnv = Math.sin(tBase * P * 12 - time * 5);
          if (pulseEnv > 0.8) alpha += (pulseEnv - 0.8) * 1.5;
          const isCorner = Math.abs(u) > 0.90 ? 1 : 0;
          alpha += isCorner * 0.4;
        }
        alpha = Math.min(1, Math.max(0, alpha));
      }

      const y1 = wy * cgx - wz * sgx;
      const z1 = wy * sgx + wz * cgx;
      const x2 = wx * cgy + z1 * sgy;
      const z2 = -wx * sgy + z1 * cgy;

      const modelScale = 2.2;
      const sx = x2 * modelScale, sy = y1 * modelScale, sz = z2 * modelScale;
      const eyeZ = 346.41016;
      const perspective = eyeZ / Math.max(72, eyeZ - sz);
      const px = 200 + sx * perspective;
      const py = 200 + sy * perspective;
      layerContext.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      layerContext.fillRect(px - 1, py - 1, 2, 2);
    }

    context.fillStyle = window.__pwBackgroundColor || '#000';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(layerCanvas, 0, 0, canvas.width, canvas.height);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
</script>
</body>
</html>
