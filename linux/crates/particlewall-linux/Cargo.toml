[package]
name = "particlewall-linux"
version = "0.1.0"
edition = "2021"
description = "ParticleWall daemon for Hyprland/Wayland."

[[bin]]
name = "particlewall"
path = "src/main.rs"

[[bin]]
name = "pw-layer-spike"
path = "src/bin/pw_layer_spike.rs"
required-features = []

[[test]]
name = "web-lifecycle"
path = "tests/web_lifecycle.rs"
harness = false
required-features = ["web", "gpu"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
gdk4-wayland = { version = "0.11", optional = true }
gtk4-layer-shell = "0.8"
webkit6 = { version = "0.6", optional = true }
particlewall-contracts = { path = "../particlewall-contracts" }
particlewall-render = { path = "../particlewall-render", optional = true }
serde_json = "1"
toml = "1"
async-channel = "2"
ksni = { version = "0.3", features = ["blocking"] }
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api"] }
serde = { version = "1.0.229", features = ["derive"] }
wayland-client = { version = "0.31", optional = true, features = ["system", "dlopen"] }
wayland-protocols-wlr = { version = "0.3", optional = true, features = ["client"] }

[features]
default = ["web", "gpu", "power"]
web = ["dep:webkit6", "dep:gdk4-wayland"]
power = ["dep:zbus"]
gpu = ["dep:particlewall-render", "dep:gdk4-wayland", "dep:wayland-client", "dep:wayland-protocols-wlr"]
